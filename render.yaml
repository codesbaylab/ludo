services:
  - type: web
    name: ludo-server
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Production only: comma-separated site origins allowed to call the HTTP API (see server/src/index.ts).
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: ludo-client
    runtime: static
    buildCommand: ""
    staticPublishPath: ./design
