<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<title>Ludo Admin — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="ui-dialog.js"></script>
<script src="supabase-client.js"></script>
<script src="app-update.js"></script>
<script src="admin-core.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  @media print {
    body.am .am-side, body.am .am-top, body.am #lib-card, body.am #builder-card, body.am #runs-card, body.am #prev-head-tools { display: none !important; }
    body.am .am-shell { display: block; } body.am .am-main { padding: 0; } body.am { background: #fff; }
    .am-card { box-shadow: none; border: 0; } #print-title { display: block !important; }
  }
</style>
</head>
<body data-page="reports" data-title="Reports" data-sub="Pick a report, tune it, download it — every export is logged in the audit trail" data-range="off">

<div id="page" style="display:none">
  <div class="am-grid g12">
    <div class="am-card" id="lib-card">
      <div class="head"><div><h3>📚 Report library</h3><div class="sub">Ready-made, auditable reports</div></div></div>
      <div class="seg-chips" id="cats"></div>
      <div id="lib"></div>
    </div>
    <div>
      <div class="am-card" id="builder-card" style="margin-bottom:16px">
        <div class="head"><div><h3 id="rep-title">Report</h3><div class="sub" id="rep-desc"></div></div><span class="chip green" id="rep-cat"></span></div>
        <div class="am-grid g3" style="margin-bottom:12px">
          <div><div class="dim" style="font-size:11px;font-weight:800;margin-bottom:4px">FROM</div><input type="date" class="input" id="r-from" /></div>
          <div><div class="dim" style="font-size:11px;font-weight:800;margin-bottom:4px">TO</div><input type="date" class="input" id="r-to" /></div>
          <div id="r-extra"><div class="dim" style="font-size:11px;font-weight:800;margin-bottom:4px">QUICK RANGE</div><select class="input" id="r-quick"><option value="30">Last 30 days</option><option value="7">Last 7 days</option><option value="90">Last 90 days</option><option value="month">This month</option><option value="lastmonth">Last month</option></select></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button class="am-btn primary" id="r-run">▶ Run &amp; preview</button><button class="am-btn" id="r-csv" disabled>⬇ CSV</button><button class="am-btn" id="r-print" disabled>🖨 Print / PDF</button>
          <span class="dim" style="font-size:12px;font-weight:700" id="r-note">Preview shows the first 60 rows. CSV and PDF include everything and are recorded in the audit log.</span>
        </div>
      </div>
      <div class="am-card" style="margin-bottom:16px">
        <h3 id="print-title" style="display:none;margin:0 0 4px"></h3>
        <div class="head" id="prev-head"><div><h3>Preview</h3><div class="sub" id="prev-sub">Run a report to see it here</div></div></div>
        <div id="prev"></div>
      </div>
    </div>
  </div>

  <div class="am-card" id="runs-card">
    <div class="head"><div><h3>🕘 Recent exports</h3><div class="sub">Every export is logged with who ran it</div></div></div>
    <div id="t-runs"></div>
  </div>
</div>

<script>
AD.boot({
  range: false,
  init: async function () {
    const LIB = [
      ['daily_revenue', '🧾', 'Daily revenue statement', 'Fees, Pro memberships, commission, deposits and withdrawals by day', 'Finance'],
      ['monthly_pnl', '📊', 'Monthly P&L', 'Revenue, commission and net by month', 'Finance'],
      ['liability_snapshot', '🏦', 'Liability snapshot', 'Who is owed what right now', 'Finance'],
      ['withdrawal_register', '⬆️', 'Withdrawal register', 'Every request with destination, tx hash and turnaround', 'Finance'],
      ['deposit_register', '⬇️', 'Deposit register', 'On-chain deposits matched to credits', 'Finance'],
      ['transfer_log', '🔁', 'Transfer log', 'Player-to-player moves with both parties', 'Compliance'],
      ['referral_commissions', '🎁', 'Referral commissions', 'By referrer, level and invitee', 'Players'],
      ['user_statement', '👤', 'Player statement', 'One player’s full wallet history', 'Players'],
      ['cohort_retention', '📈', 'Cohort & retention', 'Signup cohorts and how many came back', 'Players'],
      ['game_fairness', '🎲', 'Game fairness audit', 'Dice statistics and how matches ended', 'Games'],
      ['risk_register', '🛡️', 'Risk case register', 'Alerts, status and notes', 'Compliance'],
      ['audit_export', '📜', 'Admin audit log', 'Every admin action with before/after', 'Compliance']];
    const CATS = ['All', 'Finance', 'Players', 'Games', 'Compliance']; let cat = 'All', cur = LIB[0], last = null, statementUser = null;
    const fmtDate = function (d) { return d.toISOString().slice(0, 10); };
    const setRange = function (kind) {
      const now = new Date(); let from, to = new Date(now);
      if (kind === 'month') from = new Date(now.getFullYear(), now.getMonth(), 1);
      else if (kind === 'lastmonth') { from = new Date(now.getFullYear(), now.getMonth() - 1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0); }
      else { from = new Date(now); from.setDate(from.getDate() - (Number(kind) - 1)); }
      document.getElementById('r-from').value = fmtDate(from); document.getElementById('r-to').value = fmtDate(to);
    };
    function renderLib() {
      document.getElementById('cats').innerHTML = CATS.map(function (c) { return '<button class="' + (cat === c ? 'on' : '') + '" data-cat="' + c + '">' + c + '</button>'; }).join('');
      document.querySelectorAll('[data-cat]').forEach(function (b) { b.addEventListener('click', function () { cat = b.dataset.cat; renderLib(); }); });
      document.getElementById('lib').innerHTML = LIB.filter(function (l) { return cat === 'All' || l[4] === cat; }).map(function (l) {
        return '<div class="list-row" data-rep="' + l[0] + '" style="cursor:pointer;' + (l[0] === cur[0] ? 'background:var(--paper-2);border-radius:14px;padding:10px;border:2px solid var(--accent)' : '') + '"><span style="font-size:22px">' + l[1] + '</span><div class="grow">' + AD.esc(l[2]) + '<small>' + AD.esc(l[3]) + '</small></div><span class="chip">' + l[4] + '</span></div>';
      }).join('');
      document.querySelectorAll('[data-rep]').forEach(function (r) { r.addEventListener('click', function () { cur = LIB.find(function (l) { return l[0] === r.dataset.rep; }); last = null; renderLib(); renderBuilder(); clearPrev(); }); });
    }
    function renderBuilder() {
      document.getElementById('rep-title').textContent = cur[1] + ' ' + cur[2]; document.getElementById('rep-desc').textContent = cur[3]; document.getElementById('rep-cat').textContent = cur[4];
      const ex = document.getElementById('r-extra');
      if (cur[0] === 'user_statement') { ex.innerHTML = '<div class="dim" style="font-size:11px;font-weight:800;margin-bottom:4px">PLAYER (name, email or Player ID)</div><input class="input" id="r-user" placeholder="e.g. K7M2XQ9P" />'; statementUser = null; }
      else if (cur[0] === 'liability_snapshot') { ex.innerHTML = '<div class="dim" style="font-size:11px;font-weight:800;margin-bottom:4px">AS OF</div><div style="font-weight:800;padding:10px 0">Right now (date range ignored)</div>'; }
      else { ex.innerHTML = '<div class="dim" style="font-size:11px;font-weight:800;margin-bottom:4px">QUICK RANGE</div><select class="input" id="r-quick"><option value="30">Last 30 days</option><option value="7">Last 7 days</option><option value="90">Last 90 days</option><option value="month">This month</option><option value="lastmonth">Last month</option></select>'; document.getElementById('r-quick').addEventListener('change', function (e) { setRange(e.target.value); }); }
    }
    function clearPrev() { document.getElementById('prev').innerHTML = ''; document.getElementById('prev-sub').textContent = 'Run a report to see it here'; document.getElementById('r-csv').disabled = document.getElementById('r-print').disabled = true; }
    async function resolveUser() {
      const q = (document.getElementById('r-user') || {}).value || ''; if (!q.trim()) throw new Error('Type a player name, email or Player ID first.');
      const d = await AD.rpc('admin_users_page', { p_search: q.trim(), p_plan: 'any', p_status: 'any', p_segment: 'all', p_sort: 'name', p_limit: 5, p_offset: 0 });
      if (!d.rows.length) throw new Error('No player matches “' + q.trim() + '”.'); if (d.rows.length > 1 && d.rows[0].player_id !== q.trim().toUpperCase()) throw new Error(d.rows.length + ' players match — use the exact Player ID.');
      return d.rows[0].id;
    }
    async function run(exportMode) {
      const params = {}; if (cur[0] === 'user_statement') params.user_id = await resolveUser();
      const res = await AD.rpc('admin_report', { p_name: cur[0], p_from: document.getElementById('r-from').value, p_to: document.getElementById('r-to').value, p_params: params, p_export: !!exportMode });
      return res;
    }
    function showPreview(res) {
      last = res; const cols = res.columns;
      document.getElementById('prev-sub').textContent = res.title + ' · ' + res.rows.length + (res.truncated ? '+' : '') + ' row(s) · ' + res.from + ' → ' + res.to;
      document.getElementById('print-title').textContent = res.title + ' (' + res.from + ' → ' + res.to + ')';
      const fmt = function (c, v) { if (v === null || v === undefined || v === '') return '<span class="dim">—</span>'; return c.t === 'inr' ? AD.inr(v) : c.t === 'num' ? AD.num(v) : AD.esc(v); };
      AD.table(document.getElementById('prev'), cols.map(function (c) { return { l: AD.esc(c.label), a: c.t ? 'r' : '', k: function (r) { return fmt(c, r[c.key]); } }; }), res.rows.slice(0, 60), { wide: cols.length > 6, empty: 'No rows in this range.' });
      document.getElementById('r-csv').disabled = document.getElementById('r-print').disabled = !res.rows.length;
    }
    document.getElementById('r-run').addEventListener('click', function () { AD.run(async function () { showPreview(await run(false)); }); });
    document.getElementById('r-csv').addEventListener('click', function () { AD.run(async function () {
      const full = await run(true); showPreview(full); AD.csv(cur[0] + '_' + full.from + '_' + full.to + '.csv', full.columns, full.rows); loadRuns();
    }); });
    document.getElementById('r-print').addEventListener('click', function () { AD.run(async function () { const full = await run(true); showPreview(full); loadRuns(); setTimeout(function () { window.print(); }, 200); }); });
    document.getElementById('r-quick').addEventListener('change', function (e) { setRange(e.target.value); });
    async function loadRuns() {
      const { data } = await AD.sb.from('admin_audit_log').select('*').eq('action', 'report_exported').order('id', { ascending: false }).limit(15);
      AD.table(document.getElementById('t-runs'), [{ l: 'Report', k: function (r) { return AD.esc(r.target_name || r.target_id); } }, { l: 'Range', k: function (r) { return '<span class="dim">' + AD.esc(((r.after || {}).from || '') + ' → ' + ((r.after || {}).to || '')) + '</span>'; } }, { l: 'Rows', a: 'r', k: function (r) { return (r.after || {}).rows; } }, { l: 'Run by', k: function (r) { return AD.esc(r.admin_name || ''); } }, { l: 'When', k: function (r) { return '<span class="dim">' + AD.ago(r.created_at) + '</span>'; } }], data || [], { empty: 'No exports yet.' });
    }
    setRange('30'); renderLib(); renderBuilder(); await loadRuns();
  }
});
</script>
</body>
</html>
