<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<title>Ludo Online — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ludo">
</head>
<body>
<div class="app" style="justify-content:center;">
  <div style="padding:24px;">
    <div class="brand" style="justify-content:center; margin-bottom:14px; flex-direction:column; gap:14px;">
      <div class="dice" style="width:46px; height:46px; font-size:22px; margin:0 auto;">🔑</div>
      <h1 style="font-size:22px; text-align:center;">Set a New Password</h1>
    </div>

    <div class="card" id="reset-card">
      <p class="hint" id="loading-message" style="margin-top:0;">Checking your reset link…</p>

      <form id="form-reset" style="display:none;">
        <div class="field">
          <label>New Password</label>
          <input class="input" type="password" id="new-password" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input class="input" type="password" id="confirm-password" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary">Set Password</button>
      </form>

      <div id="invalid-link" style="display:none;">
        <p class="hint" style="margin-top:0;">This reset link is invalid or has expired.</p>
        <a href="login.html"><button class="btn btn-secondary">Back to Log In</button></a>
      </div>

      <p id="reset-message" class="hint" style="display:none;"></p>
    </div>
  </div>
</div>

<script>
  const formReset = document.getElementById('form-reset');
  const invalidLink = document.getElementById('invalid-link');
  const loadingMessage = document.getElementById('loading-message');
  const resetMessage = document.getElementById('reset-message');

  function showMessage(text, isError) {
    resetMessage.textContent = text;
    resetMessage.style.display = 'block';
    resetMessage.style.color = isError ? 'var(--red)' : 'var(--text-dim)';
  }

  // Clicking the emailed reset link lands here with a recovery token in the
  // URL — supabase-js auto-detects it (detectSessionInUrl, on by default)
  // and establishes a temporary session. If that didn't happen (broken/
  // expired/reused link, or someone just visiting this page directly),
  // there's no session and the form can't do anything useful.
  ludoSupabase.auth.getSession().then(({ data }) => {
    loadingMessage.style.display = 'none';
    if (data.session) {
      formReset.style.display = 'block';
    } else {
      invalidLink.style.display = 'block';
    }
  });

  formReset.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    if (password !== confirm) { showMessage('Passwords don\'t match.', true); return; }

    formReset.querySelectorAll('button').forEach(b => b.disabled = true);
    const { error } = await ludoSupabase.auth.updateUser({ password });
    formReset.querySelectorAll('button').forEach(b => b.disabled = false);
    if (error) { showMessage(error.message, true); return; }

    const { data: { session } } = await ludoSupabase.auth.getSession();
    location.href = (await ludoIsAdmin(session.user.id)) ? 'admin.html' : 'lobby.html';
  });
</script>
</body>
</html>
