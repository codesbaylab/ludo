<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<title>Table Kings — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="ui-dialog.js"></script>
<script src="supabase-client.js"></script>
<script src="app-update.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Table Kings">
</head>
<body>
<div class="app" style="justify-content:center;">
  <div style="padding:24px;">
    <div class="brand" style="justify-content:center; margin-bottom:14px; flex-direction:column; gap:14px;">
      <img src="icons/icon-192.png" alt="Table Kings" width="96" height="96" style="display:block; border-radius:22px; box-shadow:0 10px 26px rgba(15,43,36,.35);">
      <h1 style="font-size:26px; text-align:center;">Table Kings</h1>
      <p style="font-size:13px; color:var(--text-dim); font-weight:600; margin-top:-8px;">Ludo &amp; Rummy · play for real prizes</p>
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab active" id="tab-login">Log In</div>
        <div class="tab" id="tab-signup">Sign Up</div>
      </div>

      <form id="form-login">
        <div class="field">
          <label>Email</label>
          <input class="input" type="email" id="login-email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary">Log In</button>
        <button type="button" class="btn btn-ghost" id="forgot-password-btn" style="margin-top:8px;">Forgot password?</button>
      </form>

      <form id="form-signup" style="display:none;">
        <div class="ref-banner" id="ref-banner" style="display:none;"><span style="font-size:22px;">👑</span><span id="ref-banner-text"></span></div>
        <div class="field">
          <label>Display name</label>
          <input class="input" type="text" id="signup-name" placeholder="e.g. Ragnar" required />
        </div>
        <div class="field">
          <label>Email</label>
          <input class="input" type="email" id="signup-email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" type="password" id="signup-password" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <p id="auth-message" class="hint" style="display:none;"></p>

      <p class="hint">By continuing you agree to the Terms &amp; Privacy Policy.</p>
    </div>
  </div>
</div>

<script>
  const tabLogin = document.getElementById('tab-login');
  const tabSignup = document.getElementById('tab-signup');
  const formLogin = document.getElementById('form-login');
  const formSignup = document.getElementById('form-signup');
  const authMessage = document.getElementById('auth-message');

  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active'); tabSignup.classList.remove('active');
    formLogin.style.display = 'block'; formSignup.style.display = 'none';
  });
  tabSignup.addEventListener('click', () => {
    tabSignup.classList.add('active'); tabLogin.classList.remove('active');
    formSignup.style.display = 'block'; formLogin.style.display = 'none';
  });

  function showMessage(text, isError) {
    authMessage.textContent = text;
    authMessage.style.display = 'block';
    authMessage.style.color = isError ? 'var(--red)' : 'var(--text-dim)';
  }

  function setBusy(form, busy) {
    form.querySelectorAll('button').forEach(b => {
      b.disabled = busy;
      if (b.type === 'submit') b.classList.toggle('is-loading', busy); // spinner on the main button
    });
  }

  async function redirectAfterLogin(userId) {
    await ludoLogEvent('login');
    location.href = (await ludoIsAdmin(userId)) ? 'admin.html' : 'lobby.html';
  }

  // Already signed in? Skip straight past the login screen.
  ludoSupabase.auth.getSession().then(({ data }) => {
    if (data.session) redirectAfterLogin(data.session.user.id);
  });

  formLogin.addEventListener('submit', async (e) => {
    e.preventDefault();
    setBusy(formLogin, true);
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const { data, error } = await ludoSupabase.auth.signInWithPassword({ email, password });
    setBusy(formLogin, false);
    if (error) { showMessage(error.message, true); return; }
    redirectAfterLogin(data.user.id);
  });


  // Referral link: login.html?ref=CODE. Remembered in localStorage so it
  // survives a reload / tab switch before the visitor actually submits the
  // signup form. The handle_new_user() trigger resolves it server-side (only
  // a real Pro member's code is accepted; anything else is silently ignored).
  let refCode = new URLSearchParams(location.search).get('ref');
  try {
    if (refCode) localStorage.setItem('ludoRef', refCode);
    else refCode = localStorage.getItem('ludoRef');
  } catch {}
  if (new URLSearchParams(location.search).get('ref')) tabSignup.click();

  formSignup.addEventListener('submit', async (e) => {
    e.preventDefault();
    setBusy(formSignup, true);
    const displayName = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const { data, error } = await ludoSupabase.auth.signUp({
      email, password,
      options: { data: { display_name: displayName, ref_code: refCode || undefined } },
    });
    setBusy(formSignup, false);
    if (error) { showMessage(error.message, true); return; }
    authMessage.style.display = 'none';
    try { localStorage.removeItem('ludoRef'); } catch {}
    const via = referrerName ? ` You joined through ${referrerName}.` : '';
    if (data && data.session) { // email confirmation is off: the account is already signed in
      await ludoAlert({ tone: 'success', icon: '🎉', title: 'Account created!', message: `Welcome to Table Kings, ${displayName}!${via}`, confirmText: "Let's play" });
      redirectAfterLogin(data.session.user.id);
      return;
    }
    await ludoAlert({ tone: 'success', icon: '🎉', title: 'Account created!', message: `Welcome, ${displayName}!${via} We sent a confirmation link to ${email}. Open it, then log in.`, confirmText: 'Go to log in' });
    formSignup.reset();
    tabLogin.click();
    document.getElementById('login-email').value = email;
    document.getElementById('login-password').focus();
  });

  // Show who invited this visitor (name only), so a shared link feels personal.
  let referrerName = '';
  if (refCode) {
    ludoSupabase.rpc('referrer_name', { p_code: refCode }).then(({ data }) => {
      if (!data) { try { localStorage.removeItem('ludoRef'); } catch {} return; } // not a real Pro code: ignored by signup too
      referrerName = String(data);
      document.getElementById('ref-banner-text').textContent = `${referrerName} invited you to Table Kings`;
      document.getElementById('ref-banner').style.display = 'flex';
    }).catch(() => {});
  }

  document.getElementById('forgot-password-btn').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    if (!email) { showMessage('Enter your email above first, then tap "Forgot password?" again.', true); return; }
    ludoBusy(e.currentTarget, true);
    const { error } = await ludoSupabase.auth.resetPasswordForEmail(email, {
      redirectTo: new URL('reset-password.html', location.href).href,
    });
    ludoBusy(document.getElementById('forgot-password-btn'), false);
    if (error) { showMessage(error.message, true); return; }
    showMessage(`Password reset link sent to ${email} — check your inbox.`, false);
  });
</script>
</body>
</html>
