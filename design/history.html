<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ludo Online — History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ludo">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="lobby.html" class="nav-item" style="flex-direction:row; gap:6px; color:var(--text-dim);">← Back</a>
    <h1 style="font-size:18px;">Match History</h1>
    <div style="width:30px;"></div>
  </div>

  <div style="padding: 10px 20px;">
    <div class="stat-row" style="margin-bottom:18px;">
      <div class="stat"><div class="num" id="stat-games">…</div><div class="lbl">Games Played</div></div>
      <div class="stat"><div class="num" id="stat-wins">…</div><div class="lbl">Wins</div></div>
      <div class="stat"><div class="num" id="stat-net">…</div><div class="lbl">Net Winnings</div></div>
    </div>

    <div class="section-title">All Games</div>
    <div style="display:flex; flex-direction:column; gap:10px;" id="games-list">
      <p class="hint" style="margin:0;">Loading…</p>
    </div>

    <div class="section-title">Wallet Activity</div>
    <p class="hint" style="margin-top:0; margin-bottom:12px;">Deposits, withdrawals, and stakes are in your <a href="wallet.html">Wallet</a>.</p>
  </div>

  <div class="bottom-nav">
    <a href="lobby.html" class="nav-item"><div class="ic">🏠</div>Home</a>
    <a href="wallet.html" class="nav-item"><div class="ic">💰</div>Wallet</a>
    <div class="nav-item active"><div class="ic">📜</div>History</div>
    <a href="profile.html" class="nav-item"><div class="ic">👤</div>Profile</a>
  </div>
</div>
<script>
  (async () => {
    const { data: { session } } = await ludoSupabase.auth.getSession();
    if (!session) { location.href = 'login.html'; return; }

    const [stats, matches, { data: wallet }] = await Promise.all([
      ludoFetchStats(session.user.id),
      ludoFetchMatches(session.user.id, 50),
      ludoSupabase.from('wallets').select('balance').eq('user_id', session.user.id).single(),
    ]);

    document.getElementById('stat-games').textContent = stats.gamesPlayed;
    document.getElementById('stat-wins').textContent = stats.wins;
    // Net winnings since signup: with no deposit/withdrawal feature live yet
    // (see wallet.html), every ₹ above or below the starting ₹240 balance
    // can only have come from match stakes/payouts, so this is exact today —
    // it'll need real deposit/withdrawal tracking once that ships for real.
    const net = Number(wallet?.balance ?? 240) - 240;
    document.getElementById('stat-net').textContent = `${net >= 0 ? '+' : ''}₹${net.toFixed(0)}`;

    const list = document.getElementById('games-list');
    list.innerHTML = '';
    if (matches.length === 0) {
      list.innerHTML = '<p class="hint" style="margin:0;">No games played yet.</p>';
    } else {
      matches.forEach(m => {
        const won = m.result === 'win';
        const row = document.createElement('div');
        row.className = 'player-chip';
        const tableLabel = m.matches.stake > 0 ? `₹${m.matches.stake} table` : 'Free table';
        row.innerHTML = `
          <div class="avatar" style="width:34px; height:34px; font-size:13px; background:var(--${m.color});">${m.color[0].toUpperCase()}</div>
          <div>
            <div class="name">${won ? 'Won' : 'Lost'} as ${m.color[0].toUpperCase()}${m.color.slice(1)}</div>
            <div class="status">${tableLabel} · ${ludoTimeAgo(m.matches.finished_at)}</div>
          </div>
          <span class="badge ${won ? 'badge-ready' : 'badge-waiting'}">${won ? 'Win' : 'Loss'}</span>
        `;
        list.appendChild(row);
      });
    }
  })();
</script>
</body>
</html>
