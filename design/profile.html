<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ludo Online — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="lobby.html" class="nav-item" style="flex-direction:row; gap:6px; color:var(--text-dim);">← Back</a>
    <h1 style="font-size:18px;">Profile</h1>
    <div style="width:30px;"></div>
  </div>

  <div style="padding: 10px 20px;">
    <div class="card" style="text-align:center; padding:28px 20px;">
      <div class="avatar" style="width:72px; height:72px; font-size:28px; margin:0 auto 14px;">R</div>
      <h2 style="font-size:20px;">Ragnar</h2>
      <p style="font-size:13px; color:var(--text-dim); font-weight:600; margin-top:4px;">ragnar@example.com</p>
      <span class="badge badge-ready" style="display:inline-block; margin-top:10px;">✓ Verified</span>
    </div>

    <div class="stat-row" style="margin-top:16px;">
      <div class="stat"><div class="num">27</div><div class="lbl">Games Played</div></div>
      <div class="stat"><div class="num">12</div><div class="lbl">Wins</div></div>
      <div class="stat"><div class="num">44%</div><div class="lbl">Win Rate</div></div>
    </div>

    <div class="section-title">Account</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <a href="wallet.html" class="player-chip" style="text-decoration:none; color:inherit;">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--green-soft);">💰</div>
        <div class="name">Wallet &amp; Payment Methods</div>
        <span style="color:var(--text-faint);">›</span>
      </a>
      <a href="history.html" class="player-chip" style="text-decoration:none; color:inherit;">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--blue-soft);">📜</div>
        <div class="name">Match History</div>
        <span style="color:var(--text-faint);">›</span>
      </a>
      <div class="player-chip">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--yellow-soft);">🛡️</div>
        <div class="name">Identity Verification (KYC)</div>
        <span class="badge badge-ready">Verified</span>
      </div>
    </div>

    <div style="margin-top:22px;">
      <a href="login.html"><button class="btn btn-secondary">Log Out</button></a>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="lobby.html" class="nav-item"><div class="ic">🏠</div>Home</a>
    <a href="wallet.html" class="nav-item"><div class="ic">💰</div>Wallet</a>
    <a href="history.html" class="nav-item"><div class="ic">📜</div>History</a>
    <div class="nav-item active"><div class="ic">👤</div>Profile</div>
  </div>
</div>
</body>
</html>
