<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ludo Online — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ludo">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="lobby.html" class="nav-item" style="flex-direction:row; gap:6px; color:var(--text-dim);">← Back</a>
    <h1 style="font-size:18px;">Profile</h1>
    <div style="width:30px;"></div>
  </div>

  <div style="padding: 10px 20px;">
    <div class="card" style="text-align:center; padding:28px 20px;">
      <div class="avatar" style="width:72px; height:72px; font-size:28px; margin:0 auto 14px;" id="profile-avatar">…</div>
      <h2 style="font-size:20px;" id="profile-name">…</h2>
      <p style="font-size:13px; color:var(--text-dim); font-weight:600; margin-top:4px;" id="profile-email"></p>
    </div>

    <div class="stat-row" style="margin-top:16px;">
      <div class="stat"><div class="num" id="stat-games">…</div><div class="lbl">Games Played</div></div>
      <div class="stat"><div class="num" id="stat-wins">…</div><div class="lbl">Wins</div></div>
      <div class="stat"><div class="num" id="stat-winrate">…</div><div class="lbl">Win Rate</div></div>
    </div>

    <div class="section-title">Account</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <a href="wallet.html" class="player-chip" style="text-decoration:none; color:inherit;">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--green-soft);">💰</div>
        <div class="name">Wallet &amp; Payment Methods</div>
        <span style="color:var(--text-faint);">›</span>
      </a>
      <a href="history.html" class="player-chip" style="text-decoration:none; color:inherit;">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--blue-soft);">📜</div>
        <div class="name">Match History</div>
        <span style="color:var(--text-faint);">›</span>
      </a>
      <button type="button" class="player-chip" id="change-password-toggle" style="text-decoration:none; color:inherit; width:100%; text-align:left; font:inherit; cursor:pointer;">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--yellow-soft);">🔑</div>
        <div class="name">Change Password</div>
        <span style="color:var(--text-faint);">›</span>
      </button>
    </div>

    <div class="card" id="panel-change-password" style="margin-top:12px; display:none;">
      <div class="section-title" style="margin-top:0;">Change Password</div>
      <form id="form-change-password">
        <div class="field">
          <label>New Password</label>
          <input class="input" type="password" id="cp-new-password" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input class="input" type="password" id="cp-confirm-password" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
      <p id="cp-message" class="hint" style="display:none;"></p>
    </div>

    <div style="margin-top:22px;">
      <button class="btn btn-secondary" id="logout-btn">Log Out</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="lobby.html" class="nav-item"><div class="ic">🏠</div>Home</a>
    <a href="wallet.html" class="nav-item"><div class="ic">💰</div>Wallet</a>
    <a href="history.html" class="nav-item"><div class="ic">📜</div>History</a>
    <div class="nav-item active"><div class="ic">👤</div>Profile</div>
  </div>
</div>
<script>
  (async () => {
    const { data: { session } } = await ludoSupabase.auth.getSession();
    if (!session) { location.href = 'login.html'; return; }

    const { data: profile } = await ludoSupabase
      .from('profiles').select('display_name').eq('id', session.user.id).single();

    const name = profile?.display_name || session.user.email || 'Player';
    document.getElementById('profile-avatar').textContent = name[0].toUpperCase();
    document.getElementById('profile-name').textContent = name;
    document.getElementById('profile-email').textContent = session.user.email || '';

    const stats = await ludoFetchStats(session.user.id);
    document.getElementById('stat-games').textContent = stats.gamesPlayed;
    document.getElementById('stat-wins').textContent = stats.wins;
    document.getElementById('stat-winrate').textContent = `${stats.winRate}%`;
  })();

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await ludoSupabase.auth.signOut();
    location.href = 'login.html';
  });

  const changePasswordPanel = document.getElementById('panel-change-password');
  document.getElementById('change-password-toggle').addEventListener('click', () => {
    changePasswordPanel.style.display = changePasswordPanel.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('form-change-password').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cpMessage = document.getElementById('cp-message');
    const showCpMessage = (text, isError) => {
      cpMessage.textContent = text;
      cpMessage.style.display = 'block';
      cpMessage.style.color = isError ? 'var(--red)' : 'var(--text-dim)';
    };

    const password = document.getElementById('cp-new-password').value;
    const confirm = document.getElementById('cp-confirm-password').value;
    if (password !== confirm) { showCpMessage('Passwords don\'t match.', true); return; }

    const form = e.target;
    form.querySelectorAll('button').forEach(b => b.disabled = true);
    const { error } = await ludoSupabase.auth.updateUser({ password });
    form.querySelectorAll('button').forEach(b => b.disabled = false);
    if (error) { showCpMessage(error.message, true); return; }

    showCpMessage('Password updated.', false);
    form.reset();
  });
</script>
</body>
</html>
