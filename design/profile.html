<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<title>Ludo Online — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="app-update.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ludo">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="lobby.html" class="icon-btn" aria-label="Back" title="Back" style="text-decoration:none; font-size:20px; font-weight:800;">←</a>
    <h1 style="font-size:18px;">Profile</h1>
    <div style="width:30px;"></div>
  </div>

  <div style="padding: 10px 20px;">
    <div class="card" style="text-align:center; padding:28px 20px;">
      <div class="avatar" style="width:72px; height:72px; font-size:28px; margin:0 auto 14px;" id="profile-avatar">…</div>
      <h2 style="font-size:20px;" id="profile-name">…</h2>
      <p style="font-size:13px; color:var(--text-dim); font-weight:600; margin-top:4px;" id="profile-email"></p>
      <p style="font-size:12px; color:var(--text-dim); font-weight:700; margin-top:6px;">Player ID: <span id="profile-playerid" style="font-family:monospace; letter-spacing:1px; color:var(--text);"></span></p>
    </div>

    <div class="stat-row" style="margin-top:16px;">
      <div class="stat"><div class="num" id="stat-games">…</div><div class="lbl">Games Played</div></div>
      <div class="stat"><div class="num" id="stat-wins">…</div><div class="lbl">Wins</div></div>
      <div class="stat"><div class="num" id="stat-winrate">…</div><div class="lbl">Win Rate</div></div>
    </div>

    <div class="section-title">Refer &amp; Earn</div>
    <div id="refer-section"><p class="hint" style="margin:0;">Loading…</p></div>

    <div class="section-title">Account</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <a href="wallet.html" class="player-chip" style="text-decoration:none; color:inherit;">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--green-soft);">💰</div>
        <div class="name">Wallet &amp; Payment Methods</div>
        <span style="color:var(--text-faint);">›</span>
      </a>
      <a href="history.html" class="player-chip" style="text-decoration:none; color:inherit;">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--blue-soft);">📜</div>
        <div class="name">Match History</div>
        <span style="color:var(--text-faint);">›</span>
      </a>
      <button type="button" class="player-chip" id="change-password-toggle" style="text-decoration:none; color:inherit; width:100%; text-align:left; font:inherit; cursor:pointer;">
        <div class="tile-icon" style="width:34px; height:34px; font-size:16px; background:var(--yellow-soft);">🔑</div>
        <div class="name">Change Password</div>
        <span style="color:var(--text-faint);">›</span>
      </button>
    </div>

    <div class="card" id="panel-change-password" style="margin-top:12px; display:none;">
      <div class="section-title" style="margin-top:0;">Change Password</div>
      <form id="form-change-password">
        <div class="field">
          <label>New Password</label>
          <input class="input" type="password" id="cp-new-password" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input class="input" type="password" id="cp-confirm-password" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
      <p id="cp-message" class="hint" style="display:none;"></p>
    </div>

    <div style="margin-top:22px;">
      <button class="btn btn-secondary" id="logout-btn">Log Out</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="lobby.html" class="nav-item"><div class="ic">🏠</div>Home</a>
    <a href="wallet.html" class="nav-item"><div class="ic">💰</div>Wallet</a>
    <a href="history.html" class="nav-item"><div class="ic">📜</div>History</a>
    <div class="nav-item active"><div class="ic">👤</div>Profile</div>
  </div>
</div>
<script>
  (async () => {
    const { data: { session } } = await ludoSupabase.auth.getSession();
    if (!session) { location.href = 'login.html'; return; }

    const { data: profile } = await ludoSupabase
      .from('profiles').select('display_name, is_pro, referral_code, player_id').eq('id', session.user.id).single();

    const name = profile?.display_name || session.user.email || 'Player';
    document.getElementById('profile-avatar').textContent = name[0].toUpperCase();
    document.getElementById('profile-name').textContent = name;
    if (profile?.is_pro) document.getElementById('profile-name').insertAdjacentHTML('beforeend', ' <span class="badge badge-ready" style="vertical-align:middle;">PRO</span>');
    document.getElementById('profile-email').textContent = session.user.email || '';
    document.getElementById('profile-playerid').textContent = profile?.player_id || '';

    const stats = await ludoFetchStats(session.user.id);
    document.getElementById('stat-games').textContent = stats.gamesPlayed;
    document.getElementById('stat-wins').textContent = stats.wins;
    document.getElementById('stat-winrate').textContent = `${stats.winRate}%`;

    renderReferSection(profile).catch(err => {
      console.error('[ludo] refer section failed:', err);
      document.getElementById('refer-section').innerHTML = '<p class="hint" style="margin:0;">Could not load referral info.</p>';
    });
  })();


  // Referral link + earnings. Pro members only — free users see a locked card
  // pointing at the upgrade (the code itself doesn't exist until you go Pro).
  const fmtINR = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  async function renderReferSection(profile) {
    const el = document.getElementById('refer-section');
    if (!profile?.is_pro || !profile.referral_code) {
      el.innerHTML = `
        <div class="card" style="text-align:center; opacity:.8; padding:22px 16px;">
          <div style="font-size:30px;">🎁</div>
          <div style="font-weight:800; margin-top:6px;">Invite friends, earn commission</div>
          <p class="hint" style="margin:6px 0 12px;">Your link appears here once you go Pro.</p>
          <a href="wallet.html#pro"><button class="btn btn-primary">Go Pro to unlock</button></a>
        </div>`;
      return;
    }
    const link = new URL('login.html', location.href).href.split('#')[0] + '?ref=' + encodeURIComponent(profile.referral_code);
    const { data: sum, error } = await ludoSupabase.rpc('my_referral_summary');
    if (error) throw error;
    const levels = (sum.levels || []).map(l => `<tr><td>Level ${l.level}</td><td>${Number(l.percent)}%</td><td>${l.people}</td><td>${fmtINR(l.earned)}</td></tr>`).join('');
    const recent = (sum.recent || []).map(r => `
      <div class="player-chip"><div class="name">${escapeHtml(r.invitee)} · Level ${r.level}</div><span style="color:var(--green); font-weight:800;">+${fmtINR(r.amount)}</span></div>`).join('');
    el.innerHTML = `
      <div class="card">
        <div class="hint" style="margin:0 0 6px;">Your referral link</div>
        <div style="display:flex; gap:8px; align-items:center; background:var(--paper); border:2px dashed var(--accent); border-radius:var(--radius-md); padding:10px 12px;">
          <code id="ref-link" style="flex:1; font-size:12px; font-weight:700; word-break:break-all;">${escapeHtml(link)}</code>
          <button class="btn btn-sm btn-primary" id="ref-copy" style="width:auto;">Copy</button>
        </div>
        ${navigator.share ? '<button class="btn btn-secondary" id="ref-share" style="width:100%; margin-top:10px;">Share link</button>' : ''}
        <div class="stat-row" style="margin-top:14px;">
          <div class="stat"><div class="num">${sum.invited}</div><div class="lbl">Invited</div></div>
          <div class="stat"><div class="num">${sum.went_pro}</div><div class="lbl">Went Pro</div></div>
          <div class="stat"><div class="num">${fmtINR(sum.earned)}</div><div class="lbl">Earned</div></div>
        </div>
      </div>
      ${levels ? `<div class="section-title">Earnings by level</div><div class="card"><table style="width:100%; border-collapse:collapse; font-size:13px; font-weight:700;"><tr style="color:var(--text-dim); font-size:11px; text-align:left;"><th>Level</th><th>Rate</th><th>People</th><th>Earned</th></tr>${levels}</table></div>` : ''}
      ${recent ? `<div class="section-title">Recent rewards</div><div style="display:flex; flex-direction:column; gap:8px;">${recent}</div>` : ''}`;
    document.getElementById('ref-copy').addEventListener('click', async (e) => {
      try { await navigator.clipboard.writeText(link); e.target.textContent = 'Copied!'; } catch { e.target.textContent = 'Copy failed'; }
      setTimeout(() => { e.target.textContent = 'Copy'; }, 1500);
    });
    document.getElementById('ref-share')?.addEventListener('click', () => {
      navigator.share({ title: 'Ludo Online', text: 'Join me on Ludo Online!', url: link }).catch(() => {});
    });
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await ludoSupabase.auth.signOut();
    location.href = 'login.html';
  });

  const changePasswordPanel = document.getElementById('panel-change-password');
  document.getElementById('change-password-toggle').addEventListener('click', () => {
    changePasswordPanel.style.display = changePasswordPanel.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('form-change-password').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cpMessage = document.getElementById('cp-message');
    const showCpMessage = (text, isError) => {
      cpMessage.textContent = text;
      cpMessage.style.display = 'block';
      cpMessage.style.color = isError ? 'var(--red)' : 'var(--text-dim)';
    };

    const password = document.getElementById('cp-new-password').value;
    const confirm = document.getElementById('cp-confirm-password').value;
    if (password !== confirm) { showCpMessage('Passwords don\'t match.', true); return; }

    const form = e.target;
    form.querySelectorAll('button').forEach(b => b.disabled = true);
    const { error } = await ludoSupabase.auth.updateUser({ password });
    form.querySelectorAll('button').forEach(b => b.disabled = false);
    if (error) { showCpMessage(error.message, true); return; }

    showCpMessage('Password updated.', false);
    form.reset();
  });
</script>
</body>
</html>
