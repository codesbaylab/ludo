<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ludo Online — Confirm Stake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ludo">
</head>
<body>
<div class="app" style="justify-content:center;">
  <div style="padding:24px;">
    <div style="text-align:center; margin-bottom:18px;">
      <div class="tile-icon" style="width:56px; height:56px; font-size:26px; margin:0 auto 12px; background:var(--red-soft);">💎</div>
      <h1 id="table-title" style="font-size:22px;">Join ₹50 Table?</h1>
      <p id="table-subtitle" style="font-size:13px; color:var(--text-dim); font-weight:600; margin-top:4px;">4 players · winner takes the pot</p>
    </div>

    <div class="card">
      <span style="font-size:13px; color:var(--text-dim); font-weight:700; display:block; margin-bottom:8px;">Table Size</span>
      <div id="player-count-picker" style="display:flex; gap:8px;">
        <button type="button" class="btn btn-secondary btn-sm player-count-btn" data-count="2" style="flex:1;">2 Players</button>
        <button type="button" class="btn btn-secondary btn-sm player-count-btn" data-count="4" style="flex:1;">4 Players</button>
      </div>
    </div>

    <div class="card" id="pricing-card" style="margin-top:12px;">
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
        <span style="font-size:13px; color:var(--text-dim); font-weight:700;">Your Stake</span>
        <span id="stat-stake" style="font-size:14px; font-weight:800;">₹50</span>
      </div>
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
        <span id="pot-label" style="font-size:13px; color:var(--text-dim); font-weight:700;">Total Pot (4 × ₹50)</span>
        <span id="stat-pot" style="font-size:14px; font-weight:800;">₹200</span>
      </div>
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
        <span style="font-size:13px; color:var(--text-dim); font-weight:700;">Platform Fee (10%)</span>
        <span id="stat-fee" style="font-size:14px; font-weight:800; color:var(--text-dim);">-₹20</span>
      </div>
      <div style="display:flex; justify-content:space-between; padding:14px 0 6px;">
        <span style="font-size:14px; font-weight:800;">🏆 Winner Gets</span>
        <span id="stat-payout" style="font-size:20px; font-weight:800; color:#178a4c;">₹180</span>
      </div>
    </div>

    <div class="card" id="wallet-card" style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-size:12px; color:var(--text-dim); font-weight:700;">Wallet Balance</div>
        <div style="font-size:18px; font-weight:800;">₹240.00</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px; color:var(--text-dim); font-weight:700;">After Stake</div>
        <div id="stat-after" style="font-size:18px; font-weight:800;">₹190.00</div>
      </div>
    </div>

    <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
      <a id="confirm-link" href="waiting-room.html?stake=50"><button class="btn btn-primary" id="confirm-btn">Confirm &amp; Lock ₹50</button></a>
      <a href="lobby.html"><button class="btn btn-ghost">Cancel</button></a>
      <p class="hint" id="confirm-hint">Your stake is locked the moment you join and returned in full if the table never fills.</p>
    </div>
  </div>
</div>
<script>
  const WALLET_BALANCE = 240;
  const stakeParam = new URLSearchParams(location.search).get('stake');
  const stake = stakeParam === null ? 50 : Math.max(0, Number(stakeParam) || 0);
  const isFree = stake <= 0;
  const initialPlayers = [2, 4].includes(Number(new URLSearchParams(location.search).get('players')))
    ? Number(new URLSearchParams(location.search).get('players'))
    : 4;
  let playerCount = initialPlayers;

  function render() {
    document.getElementById('confirm-link').href = `waiting-room.html?stake=${stake}&players=${playerCount}`;

    if (isFree) {
      document.getElementById('table-title').textContent = 'Quick Match';
      document.getElementById('table-subtitle').textContent = `${playerCount} players · free — no stakes`;
      document.getElementById('pricing-card').style.display = 'none';
      document.getElementById('wallet-card').style.display = 'none';
      document.getElementById('confirm-btn').textContent = 'Start Match';
      document.getElementById('confirm-hint').textContent = 'No stakes in a free match — just pick your table size and go.';
    } else {
      const pot = stake * playerCount;
      const fee = Math.round(pot * 0.1);
      const payout = pot - fee;

      document.getElementById('table-title').textContent = `Join ₹${stake} Table?`;
      document.getElementById('table-subtitle').textContent = `${playerCount} players · winner takes the pot`;
      document.getElementById('stat-stake').textContent = `₹${stake}`;
      document.getElementById('pot-label').textContent = `Total Pot (${playerCount} × ₹${stake})`;
      document.getElementById('stat-pot').textContent = `₹${pot}`;
      document.getElementById('stat-fee').textContent = `-₹${fee}`;
      document.getElementById('stat-payout').textContent = `₹${payout}`;
      document.getElementById('stat-after').textContent = `₹${(WALLET_BALANCE - stake).toFixed(2)}`;
      document.getElementById('confirm-btn').textContent = `Confirm & Lock ₹${stake}`;
      document.getElementById('confirm-hint').textContent = 'Your stake is locked the moment you join and returned in full if the table never fills.';
    }

    document.querySelectorAll('.player-count-btn').forEach((btn) => {
      const selected = Number(btn.dataset.count) === playerCount;
      btn.classList.toggle('btn-primary', selected);
      btn.classList.toggle('btn-secondary', !selected);
    });
  }

  document.querySelectorAll('.player-count-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      playerCount = Number(btn.dataset.count);
      render();
    });
  });

  render();
</script>
</body>
</html>
