<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ludo Online — Waiting Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="https://unpkg.com/colyseus.js@0.15.20/dist/colyseus.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ludo">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="lobby.html" class="nav-item" id="leave-link" style="flex-direction:row; gap:6px; color:var(--text-dim);">← Leave</a>
    <h1 style="font-size:17px;">Waiting Room</h1>
    <span class="badge badge-cash" id="table-badge">₹50 Table</span>
  </div>

  <div style="padding: 10px 20px;">
    <div class="room-code-box">
      <div>
        <div style="font-size:11px; color:#a3521f; font-weight:800; text-transform:uppercase;">Room Code</div>
        <div class="code" id="room-code">…</div>
      </div>
      <button class="btn btn-secondary btn-sm" id="copy-code-btn">📋 Copy</button>
    </div>

    <div class="card" id="prize-card" style="margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg, var(--green-soft), var(--paper));">
      <div>
        <div style="font-size:12px; color:var(--text-dim); font-weight:700;">🏆 Prize Pool (after 10% fee)</div>
        <div id="prize-amount" style="font-size:24px; font-weight:800; color:#178a4c;">₹180</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px; color:var(--text-dim); font-weight:700;">Your Stake</div>
        <div id="stake-amount" style="font-size:19px; font-weight:800;">₹50</div>
      </div>
    </div>

    <div class="section-title" id="players-title">Players (0/4)</div>
    <div style="display:flex; flex-direction:column; gap:10px;" id="players-list"></div>

    <div class="section-title">Settings</div>
    <div class="card" style="display:flex; flex-direction:column; gap:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:14px; font-weight:700;">Max Players</span>
        <span id="max-players-value" style="color:var(--text-dim); font-size:14px; font-weight:700;">4</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:14px; font-weight:700;">Turn Timer</span>
        <span style="color:var(--text-dim); font-size:14px; font-weight:700;">15s</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:14px; font-weight:700;">Room Type</span>
        <span id="room-type" style="color:var(--text-dim); font-size:14px; font-weight:700;">Private · Cash</span>
      </div>
    </div>

    <div style="margin-top:22px; display:flex; flex-direction:column; gap:10px;">
      <p id="start-hint" class="hint">Waiting for the table to fill — the game starts automatically once everyone's in.</p>
    </div>
  </div>
</div>
<script>
  const stakeParam = new URLSearchParams(location.search).get('stake');
  const stake = stakeParam === null ? 50 : Math.max(0, Number(stakeParam) || 0);
  const playersParam = Number(new URLSearchParams(location.search).get('players'));
  const playerCount = [2, 4].includes(playersParam) ? playersParam : 4;
  const isFree = stake <= 0;
  const pot = stake * playerCount;
  const fee = Math.round(pot * 0.1);
  const payout = pot - fee;
  // Same default/override pattern as design/game.js.
  const SERVER_URL = new URLSearchParams(location.search).get('server') || 'wss://ludo-x96u.onrender.com';

  document.getElementById('max-players-value').textContent = String(playerCount);

  if (isFree) {
    document.getElementById('table-badge').textContent = 'Free Match';
    document.getElementById('table-badge').className = 'badge badge-ready';
    document.getElementById('prize-card').style.display = 'none';
    document.getElementById('room-type').textContent = 'Private · Free';
  } else {
    document.getElementById('table-badge').textContent = `₹${stake} Table`;
    document.getElementById('prize-amount').textContent = `₹${payout}`;
    document.getElementById('stake-amount').textContent = `₹${stake}`;
  }

  function renderPlayers(snapshot, mySessionId) {
    const connected = snapshot.players.filter(p => p.connected).length;
    document.getElementById('players-title').textContent = `Players (${connected}/${snapshot.players.length})`;

    const list = document.getElementById('players-list');
    list.innerHTML = '';
    snapshot.players.forEach(p => {
      const isMe = p.connected && p.sessionId === mySessionId;
      const chip = document.createElement('div');
      chip.className = 'player-chip' + (p.connected ? ' ready' : ' empty');
      const avatarStyle = p.connected
        ? `background:var(--${p.color});`
        : 'background:var(--paper-2); color:var(--text-faint); box-shadow:none; border:2px dashed var(--border);';
      const initial = p.connected ? (p.name || '?')[0].toUpperCase() : '?';
      const nameText = p.connected ? (p.name || 'Player') + (isMe ? ' (You)' : '') : 'Waiting for player…';
      chip.innerHTML = `
        <div class="avatar" style="width:36px; height:36px; font-size:13px; ${avatarStyle}">${initial}</div>
        <div class="name"${p.connected ? '' : ' style="color:var(--text-faint);"'}>${nameText}</div>
        ${p.connected ? `<span class="badge ${isMe ? 'badge-host' : 'badge-ready'}">${isMe ? 'You' : 'Ready'}</span>` : ''}
      `;
      list.appendChild(chip);
    });
  }

  (async () => {
    const { data: { session } } = await ludoSupabase.auth.getSession();
    if (!session) { location.href = 'login.html'; return; }

    const { data: profile } = await ludoSupabase
      .from('profiles').select('display_name').eq('id', session.user.id).single();

    const client = new Colyseus.Client(SERVER_URL);
    let room;
    try {
      room = await client.joinOrCreate('ludo', {
        name: profile?.display_name || session.user.email || 'Player',
        userId: session.user.id,
        stake,
        playerCount,
      });
    } catch (err) {
      console.error('[ludo] failed to join waiting room:', err);
      document.getElementById('players-title').textContent = 'Could not reach the game server';
      document.getElementById('start-hint').textContent = 'Could not reach the game server. Is it running?';
      return;
    }

    document.getElementById('room-code').textContent = room.roomId;
    document.getElementById('copy-code-btn').addEventListener('click', () => {
      navigator.clipboard?.writeText(room.roomId).catch(() => {});
    });
    document.getElementById('leave-link').addEventListener('click', () => {
      room.leave(true); // consented — frees the seat immediately instead of
                         // holding it open for the reconnection grace period.
    });

    let navigated = false;
    room.onStateChange(state => {
      const snapshot = state.toJSON();
      renderPlayers(snapshot, room.sessionId);

      if (!navigated && snapshot.players.every(p => p.connected)) {
        navigated = true;
        document.getElementById('start-hint').textContent = 'All players ready! Starting…';
        // Hands this exact seat off to board.html: the navigation closes this
        // WebSocket, which LudoRoom's onLeave treats as an unexpected drop
        // and holds the seat open (see server-side reconnection handling) —
        // board.html then resumes it with client.reconnect() instead of
        // taking a fresh joinOrCreate seat, which would otherwise double up.
        sessionStorage.setItem('ludoReconnectToken', room.reconnectionToken);
        setTimeout(() => { location.href = `board.html?stake=${stake}&players=${playerCount}`; }, 700);
      }
    });

    room.onLeave(() => {
      if (navigated) return; // expected — we're the one navigating away
      document.getElementById('start-hint').textContent = 'Disconnected from the game server.';
    });
  })();
</script>
</body>
</html>
